function normalize(text) {
    if (!text) return '';
    let t = text.toLowerCase().replace(/[^а-яёa-z0-9]/g, '');
    t = t.replace(/0/g,'о').replace(/1/g,'и').replace(/3/g,'з')
         .replace(/4/g,'а').replace(/6/g,'б').replace(/7/g,'т')
         .replace(/8/g,'в').replace(/9/g,'д');
    const map = {'a':'а','b':'б','c':'с','d':'д','e':'е','f':'ф','g':'г',
        'h':'н','i':'и','j':'й','k':'к','l':'л','m':'м','n':'н','o':'о',
        'p':'р','q':'к','r':'р','s':'с','t':'т','u':'у','v':'в','w':'в',
        'x':'х','y':'у','z':'з'};
    return t.split('').map(ch => map[ch] || ch).join('');
}

function getShapePath(form, cx, cy, r, color, strokeStyle, strokeWidth) {
    const dash = strokeStyle === 'dashed' ? 'stroke-dasharray="12 8"' :
                 strokeStyle === 'dotted' ? 'stroke-dasharray="2 8"' : '';
    const attrs = `fill="none" stroke="${color}" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round" ${dash}`;
    switch(form) {
        case 'circle': return `<circle cx="${cx}" cy="${cy}" r="${r}" ${attrs}/>`;
        case 'square': return `<rect x="${cx-r}" y="${cy-r}" width="${r*2}" height="${r*2}" ${attrs}/>`;
        case 'roundedRect': return `<rect x="${cx-r}" y="${cy-r}" width="${r*2}" height="${r*2}" rx="30" ${attrs}/>`;
        case 'oval': return `<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r*0.7}" ${attrs}/>`;
        case 'triangle': return `<polygon points="${cx},${cy-r} ${cx+r},${cy+r*0.7} ${cx-r},${cy+r*0.7}" ${attrs}/>`;
        case 'hexagon': {
            let p = '';
            for (let i = 0; i < 6; i++) {
                const a = (Math.PI / 3) * i - Math.PI / 6;
                p += `${(cx + r*Math.cos(a)).toFixed(1)},${(cy + r*Math.sin(a)).toFixed(1)} `;
            }
            return `<polygon points="${p.trim()}" ${attrs}/>`;
        }
        case 'star': {
            let p = '';
            for (let i = 0; i < 10; i++) {
                const a = (Math.PI / 5) * i - Math.PI / 2;
                const rad = i % 2 === 0 ? r : r * 0.4;
                p += `${(cx + rad*Math.cos(a)).toFixed(1)},${(cy + rad*Math.sin(a)).toFixed(1)} `;

        }
        case 'diamond': return `<polygon points="${cx},${cy-r} ${cx+r},${cy} ${cx},${cy+r} ${cx-r},${cy}" ${attrs}/>`;
        case 'pentagon': {
            let p = '';

                p += `${(cx + r*Math.cos(a)).toFixed(1)},${(cy + r*Math.sin(a)).toFixed(1)} `;

            <line x1="${cx-off}" y1="${cy-off}" x2="${cx-off+size}" y2="${cy-off}" ${g}/>
            <line x1="${cx-off}" y1="${cy-off}" x2="${cx-off}" y2="${cy-off+size}" ${g}/>
            <line x1="${cx+off}" y1="${cy+off}" x2="${cx+off-size}" y2="${cy+off}" ${g}/>
            <line x1="${cx+off}" y1="${cy+off}" x2="${cx+off}" y2="${cy+off-size}" ${g}/>`;
    }
    return '';
}

function renderText(text, cx, cy, fontSize, font, color, colorDim, effect, gradId) {
    const baseAttrs = `text-anchor="middle" font-family="${font}" font-size="${fontSize}" font-weight="900"`;
    if (effect === 'outline') return `<text x="${cx}" y="${cy}" ${baseAttrs} fill="none" stroke="${color}" stroke-width="2">${text}</text>`;
    if (effect === 'double') return `
        <text x="${cx}" y="${cy}" ${baseAttrs} fill="none" stroke="${color}" stroke-width="4">${text}</text>
        <text x="${cx}" y="${cy}" ${baseAttrs} fill="${colorDim}">${text}</text>`;
    if (effect === 'gradient') return `<text x="${cx}" y="${cy}" ${baseAttrs} fill="url(#${gradId})">${text}</text>`;
    return `<text x="${cx}" y="${cy}" ${baseAttrs} fill="${color}">${text}</text>`;
}

function getBigIcon(icons, cx, cy, pal, fontSize, position) {
    if (!icons || !icons.length) return '';
    const icon = rnd(icons);
    let iconSize = fontSize * 1.3;
    let x = cx;
    let y = cy;
    const offset = fontSize * 1.4;

    if (position === 'top') { y = cy - offset; }
    else if (position === 'bottom') { y = cy + offset + 10; }
    else if (position === 'left') { x = cx - offset * 1.3; }
    else if (position === 'right') { x = cx + offset * 1.3; }
    else if (position === 'corner-tl') { x = 45; y = 45; iconSize = 36; }
    else if (position === 'corner-tr') { x = 195; y = 45; iconSize = 36; }
    else if (position === 'corner-bl') { x = 45; y = 200; iconSize = 36; }
    else if (position === 'corner-br') { x = 195; y = 200; iconSize = 36; }

    return `<text x="${x}" y="${y}" text-anchor="middle" font-family="Arial, sans-serif" font-size="${iconSize}" font-weight="900" fill="${pal.bright}">${icon}</text>`;
}
function generate() {
    const userInput = document.getElementById('userText').value.trim().toUpperCase();
    let display;
    if (userInput) {
        display = userInput;
    } else {
        const useSymbol = Math.random() < 0.35;
        display = useSymbol ? rnd(allIcons) : String.fromCharCode(65 + rndInt(0, 25));
    }

    const warnBox = document.getElementById('warnBox');
    const themeHint = document.getElementById('themeHint');
    const downloadBtn = document.getElementById('downloadBtn');
    const logoBox = document.getElementById('logoBox');

    if (isBadWord(display)) {
        warnBox.textContent = '⛔ Запрещённое слово. Введите другое.';
        themeHint.textContent = '';
        logoBox.innerHTML = '<div style="width:100%;height:100%;background:#000;"></div>';
        downloadBtn.disabled = true;
        currentSVG = '';
        return;
    } else {
        warnBox.textContent = '';
        downloadBtn.disabled = false;
    }

    const theme = detectTheme(display);

    let palettes, fonts, icons, decorations, shapes, backgrounds, effects;
    if (theme) {
        palettes = theme.palettes;
        fonts = theme.fonts;
        icons = theme.icons;
        decorations = theme.decorations;
        shapes = theme.shapes;
        backgrounds = theme.backgrounds.concat(['icons']);
        effects = theme.effects;
        themeHint.textContent = 'Активирована тема: ' + theme.label;
    } else {
        palettes = allPalettes;
        fonts = allFonts;
        icons = allIcons;
        decorations = allDecorations;
        shapes = allShapes;
        backgrounds = allBackgrounds;
        effects = allEffects;
        themeHint.textContent = '';
    }

    const pal = rnd(palettes);
    const font = rnd(fonts);
    const dec = rnd(decorations);
    const strokeStyle = rnd(allStrokeStyles);
    const composition = rnd(allCompositions);
    const bgPattern = rnd(backgrounds);
    const textEffect = rnd(effects);
    const rotation = rndInt(-25, 25);
    const strokeWidth = rndInt(6, 12);

    const size = 240;
    const cx = size / 2;
    const cy = size / 2;
    const gradId = 'grad' + Math.random().toString(36).substring(2, 9);
    const glowId = 'glow' + Math.random().toString(36).substring(2, 9);

    const bgSVG = getBackground(bgPattern, pal.bright, size, icons);
    let mainSVG = '';
    let textLayer = '';

    if (composition === 'text-in-shape') {
        const shapeSize = rndInt(70, 85);
        const form = rnd(shapes);
        const shapeSVG = getShapePath(form, cx, cy, shapeSize, `url(#${gradId})`, strokeStyle, strokeWidth);
        const decorationSVG = getDecoration(dec, cx, cy, shapeSize, pal.bright);
        let fontSize = Math.min(72, 240 / Math.max(display.length, 1));
        fontSize = Math.max(fontSize, 12) * 0.75;
        textLayer = renderText(display, cx, cy + fontSize * 0.35, fontSize, font, pal.bright, pal.dim, textEffect, gradId);
        mainSVG = `${decorationSVG}<g transform="rotate(${rotation} ${cx} ${cy})">${shapeSVG}</g>`;
    } else if (composition === 'text-above-shape') {
        const form = rnd(shapes);
        let fontSize = Math.min(46, 220 / Math.max(display.length, 1));
        fontSize = Math.max(fontSize, 14);
        const shapeY = cy + 55;
        const shapeSVG = getShapePath(form, cx, shapeY, 45, `url(#${gradId})`, strokeStyle, strokeWidth);
        textLayer = renderText(display, cx, cy - 15, fontSize, font, pal.bright, pal.dim, textEffect, gradId);
        mainSVG = `<g transform="rotate(${rotation} ${cx} ${shapeY})">${shapeSVG}</g>`;
    } else if (composition === 'text-beside-shape') {
        const form = rnd(shapes);
        const shapeX = 55;
        const shapeSVG = getShapePath(form, shapeX, cy, 45, `url(#${gradId})`, strokeStyle, strokeWidth);
        const symbol = rnd(icons);
        let fontSize = Math.min(48, 180 / Math.max(display.length, 1));
        fontSize = Math.max(fontSize, 12);
        mainSVG = `<g transform="rotate(${rotation} ${shapeX} ${cy})">${shapeSVG}</g>
                   <text x="${shapeX}" y="${cy + 15}" text-anchor="middle" font-family="${font}" font-size="40" font-weight="900" fill="${pal.bright}">${symbol}</text>`;
        textLayer = renderText(display, 155, cy + fontSize * 0.35, fontSize, font, pal.bright, pal.dim, textEffect, gradId);
    } else if (composition === 'text-on-banner') {
        const bannerH = 60, bannerW = 200;
        const bannerY = cy - bannerH / 2, bannerX = cx - bannerW / 2;
        mainSVG = `
            <path d="M ${bannerX - 15} ${bannerY} L ${bannerX + bannerW + 15} ${bannerY} L ${bannerX + bannerW} ${bannerY + bannerH} L ${bannerX} ${bannerY + bannerH} Z"
                  fill="none" stroke="url(#${gradId})" stroke-width="${strokeWidth}" stroke-linejoin="round" transform="rotate(${rotation} ${cx} ${cy})"/>`;
        let fontSize = Math.min(36, 200 / Math.max(display.length, 1));
        fontSize = Math.max(fontSize, 14);
        textLayer = renderText(display, cx, cy + fontSize * 0.35, fontSize, font, pal.bright, pal.dim, textEffect, gradId);
    } else if (composition === 'two-shapes') {
        const outerForm = rnd(shapes), innerForm = rnd(shapes);
        const outer = getShapePath(outerForm, cx, cy, 85, `url(#${gradId})`, strokeStyle, strokeWidth);
        const inner = getShapePath(innerForm, cx, cy, 55, pal.bright, 'solid', 2);
        let fontSize = Math.min(60, 200 / Math.max(display.length, 1));
        fontSize = Math.max(fontSize, 12) * 0.7;
        textLayer = renderText(display, cx, cy + fontSize * 0.35, fontSize, font, pal.bright, pal.dim, textEffect, gradId);
        mainSVG = `<g transform="rotate(${rotation} ${cx} ${cy})">${outer}<g opacity="0.6">${inner}</g></g>`;
    } else if (composition === 'text-only-decor') {
        let fontSize = Math.min(60, 260 / Math.max(display.length, 1));
        fontSize = Math.max(fontSize, 14);
        const lineY1 = cy + fontSize * 0.7, lineY2 = cy - fontSize * 0.9, lineLen = 100;
        const symbol = rnd(icons);
        mainSVG = `
            <line x1="${cx - lineLen}" y1="${lineY1}" x2="${cx + lineLen}" y2="${lineY1}" stroke="url(#${gradId})" stroke-width="3" opacity="0.7"/>
            <line x1="${cx - lineLen}" y1="${lineY2}" x2="${cx + lineLen}" y2="${lineY2}" stroke="url(#${gradId})" stroke-width="3" opacity="0.7"/>
            <text x="${cx - lineLen - 15}" y="${lineY1 + 6}" text-anchor="middle" font-size="18" fill="${pal.bright}">${symbol}</text>
            <text x="${cx + lineLen + 15}" y="${lineY1 + 6}" text-anchor="middle" font-size="18" fill="${pal.bright}">${symbol}</text>`;
        textLayer = renderText(display, cx, cy + fontSize * 0.35, fontSize, font, pal.bright, pal.dim, textEffect, gradId);
    }

    let bigIcon = '';
    if (theme && Math.random() < 0.7) {
        const positions = ['top','bottom','left','right','corner-tl','corner-tr','corner-bl','corner-br'];
        const pos = rnd(positions);
        let iconSize;
        if (composition === 'text-in-shape') iconSize = 50;
        else if (composition === 'two-shapes') iconSize = 45;
        else iconSize = 60;
        bigIcon = getBigIcon(icons, cx, cy, pal, iconSize, pos);
    }

    currentSVG = `
<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${pal.bright}"/>
            <stop offset="100%" stop-color="${pal.dim}"/>
        </linearGradient>
        <filter id="${glowId}" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>
    ${bgSVG}
    <g filter="url(#${glowId})">
        ${mainSVG}
        ${textLayer}
        ${bigIcon}
    </g>
</svg>`;

    logoBox.innerHTML = currentSVG;

    if (typeof ym === 'function') { ym(113542645, 'reachGoal', 'logo_generated'); }
}

function downloadSVG() {
    if (!currentSVG) return;
    if (typeof ym === 'function') { ym(113542645, 'reachGoal', 'svg_downloaded'); }
    const blob = new Blob([currentSVG], {type: 'image/svg+xml'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'logo_' + Date.now() + '.svg';
    a.click();
    URL.revokeObjectURL(url);
}

document.getElementById('userText').addEventListener('input', generate);
generate();
</script>
</body>
</html>
